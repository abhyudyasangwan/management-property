<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tenancy Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column. Top bar (manager dropdown, search, add), manager heading with filter, then an accordion of property cards. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#f7f9f7;
  --ink:#0f1612; --ink-2:#56635c; --ink-3:#85928b;
  --line:#e1e6e2; --line-2:#cdd5d0; --track:#e3e8e4;
  --accent:#139150; --accent-ink:#0b6b3b; --accent-soft:#dff3e8; --on-accent:#ffffff;
  --amber:#9a5806; --amber-soft:#fcefd4;
  --danger:#b42318;
  --btn:#0f1612; --on-btn:#ffffff;
  --shadow:0 10px 30px rgba(15,22,18,.12);
  --font-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c110e; --surface:#141b17; --surface-2:#18211c;
    --ink:#ecf2ee; --ink-2:#a0aea6; --ink-3:#74827a;
    --line:#232d27; --line-2:#334039; --track:#222c26;
    --accent:#34c77b; --accent-ink:#79e0aa; --accent-soft:#143324; --on-accent:#05160d;
    --amber:#f2b552; --amber-soft:#35290f;
    --danger:#ff8a7a;
    --btn:#ecf2ee; --on-btn:#0c110e;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c110e; --surface:#141b17; --surface-2:#18211c;
  --ink:#ecf2ee; --ink-2:#a0aea6; --ink-3:#74827a;
  --line:#232d27; --line-2:#334039; --track:#222c26;
  --accent:#34c77b; --accent-ink:#79e0aa; --accent-soft:#143324; --on-accent:#05160d;
  --amber:#f2b552; --amber-soft:#35290f;
  --danger:#ff8a7a;
  --btn:#ecf2ee; --on-btn:#0c110e;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"brand mgr search add";gap:12px;align-items:center;padding-top:20px;padding-bottom:6px}
.brand{grid-area:brand;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-mark{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.brand-mark svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mgr{grid-area:mgr;position:relative}
.search{grid-area:search;position:relative;min-width:0}
.add{grid-area:add}
@media (max-width:760px){
  .top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand add" "mgr mgr" "search search"}
}

.mgr-btn{display:flex;align-items:center;gap:10px;width:100%;min-width:230px;padding:7px 12px 7px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.mgr-btn:hover{border-color:var(--line-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em;flex:none}
.mgr-txt{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.mgr-txt small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mgr-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-btn .ico{color:var(--ink-3)}

.pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;min-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:11px}
.opt:hover,.opt:focus-visible{background:var(--surface-2)}
.opt[aria-selected="true"]{background:var(--accent-soft)}
.opt .txt{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.opt .txt b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.opt .txt span{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-empty{padding:14px 12px;color:var(--ink-2)}

.search-field{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink-3)}
.search-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-field input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink)}
.search-field input::placeholder{color:var(--ink-3)}
.hit .txt span{white-space:normal}

.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;background:var(--btn);color:var(--on-btn);font-weight:600;white-space:nowrap}
.btn-primary:hover{opacity:.9}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);font-weight:600}
.btn-ghost:hover{background:var(--surface-2)}

/* page head */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:34px;padding-bottom:18px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5.5vw,44px);line-height:1.04;letter-spacing:-.025em;margin:0;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--ink-2)}
.filters{display:flex;gap:2px;padding:3px;border-radius:13px;background:var(--track);max-width:100%}
.filters button{padding:8px 13px;border-radius:10px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.filters .n{font-weight:500;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}

.banner{margin:0 0 14px;padding:11px 14px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-weight:500}

/* property cards */
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:max(64px,env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;scroll-margin-top:16px}
.card:hover{border-color:var(--line-2)}
.card[data-open="true"]{border-color:var(--line-2);box-shadow:0 6px 24px rgba(15,22,18,.06)}
.card.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 4px transparent}}
.card-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;width:100%;padding:18px 20px;border-radius:18px;align-items:start}
.card-head h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere}
.card-head .who{margin:0;color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}
.side{display:flex;align-items:center;gap:10px;grid-row:1;grid-column:2}
.chev{color:var(--ink-3);transition:transform .2s}
.card[data-open="true"] .chev{transform:rotate(180deg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.done{background:var(--accent-soft);color:var(--accent-ink)}
.chip.ongoing{background:var(--amber-soft);color:var(--amber)}
.bar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;height:7px;grid-column:1/-1;margin-top:14px}
.bar i{border-radius:99px;background:var(--track)}
.bar i.on{background:var(--accent)}
.bar i.now{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cur{grid-column:1/-1;margin-top:8px;font-size:13.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px}
.cur b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.card-body{padding:2px 20px 22px;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sec-title{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:18px 0 8px}

.steps{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2)}
.step+.step{border-top:1px solid var(--line)}
.step-head{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px}
.step-head:hover{background:var(--surface)}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums;background:var(--surface)}
.dot svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.step[data-state="done"] .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step[data-state="ongoing"] .dot{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.step-main{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;flex:1;min-width:0}
.step-name{font-weight:600}
.step[data-state="todo"] .step-name{font-weight:500}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--amber-soft);color:var(--amber);white-space:nowrap}
.meta{font-size:13px;color:var(--ink-2)}
.has-note{color:var(--ink-3)}
.step-body{padding:2px 14px 16px 52px;animation:rise .15s ease-out}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
textarea,.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:0}
textarea{resize:vertical;min-height:76px;line-height:1.45}
textarea:focus,.field input:focus,.field select:focus,.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea::placeholder,input::placeholder{color:var(--ink-3)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{padding:8px 15px;border-radius:99px;border:1px solid var(--line-2);font-weight:600;background:var(--surface);color:var(--ink-2)}
.pill:hover{border-color:var(--ink-3)}
.pill[aria-pressed="true"]{border-color:transparent;background:var(--btn);color:var(--on-btn)}
.pill.ok[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pill[disabled]{opacity:.5;cursor:not-allowed}

.details{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.details .full{grid-column:1/-1}
.group{display:flex;flex-direction:column;gap:10px;min-width:0}
.group h4{margin:0;font-size:14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
@media (max-width:620px){
  .details{grid-template-columns:1fr}
  .step-body{padding-left:14px}
  .card-head{padding:16px}
  .card-body{padding-left:14px;padding-right:14px}
}

.empty{text-align:center;padding:56px 20px;border:1.5px dashed var(--line-2);border-radius:18px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:20px;margin-bottom:4px}

/* add property modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,10,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;animation:rise .18s ease-out}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.sheet h2{margin:0;font-family:var(--font-display);font-size:24px;letter-spacing:-.02em}
.sheet p.hint{margin:0 0 16px;color:var(--ink-2);font-size:14px}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.x:hover{background:var(--surface-2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.form fieldset{border:0;margin:0;padding:0;display:contents}
.form .legend{grid-column:1/-1;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-top:6px}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:0}
.err{color:var(--danger);font-size:13px;min-height:0}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
@media (max-width:520px){.form{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--btn);color:var(--on-btn);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Tenancy Tracker</div>

    <div class="mgr" id="mgr">
      <button class="mgr-btn" id="mgrBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="mgrList">
        <span class="avatar" id="mgrAvatar"></span>
        <span class="mgr-txt"><small>Property manager</small><b id="mgrName"></b></span>
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="mgrList" role="listbox" aria-label="Property managers" hidden></div>
    </div>

    <div class="search" id="search">
      <label class="search-field">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search all properties" autocomplete="off" aria-label="Search all properties">
      </label>
      <div class="pop" id="results" hidden></div>
    </div>

    <button class="btn-primary add" id="addBtn" type="button">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add property
    </button>
  </header>

  <section class="head">
    <div>
      <h1 id="pageTitle"></h1>
      <p class="sub" id="pageSub"></p>
    </div>
    <div class="filters" role="group" aria-label="Filter properties">
      <button type="button" data-filter="all" aria-pressed="true">All<span class="n" id="nAll"></span></button>
      <button type="button" data-filter="open" aria-pressed="false">Not completed<span class="n" id="nOpen"></span></button>
      <button type="button" data-filter="done" aria-pressed="false">Completed<span class="n" id="nDone"></span></button>
    </div>
  </section>

  <div id="banner" class="banner" hidden></div>
  <main class="list" id="list"><div class="empty">Loading properties…</div></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet-head">
      <h2 id="mTitle">Add property</h2>
      <button class="x" id="mClose" type="button" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <p class="hint">All 10 steps are added automatically. Only the address is required.</p>
    <form id="addForm" class="form" novalidate>
      <div class="field full">
        <label for="a-address">Property address</label>
        <input id="a-address" autocomplete="off" placeholder="12 Harbour Street, Sydney NSW">
        <span class="err" id="a-err"></span>
      </div>
      <div class="field full">
        <label for="a-mgr">Property manager</label>
        <select id="a-mgr"></select>
      </div>
      <fieldset>
        <div class="legend">Tenant</div>
        <div class="field full"><label for="a-tname">Name</label><input id="a-tname" autocomplete="off"></div>
        <div class="field"><label for="a-tmobile">Mobile</label><input id="a-tmobile" type="tel" autocomplete="off"></div>
        <div class="field"><label for="a-temail">Email</label><input id="a-temail" type="email" autocomplete="off"></div>
      </fieldset>
      <fieldset>
        <div class="legend">Owner</div>
        <div class="field full"><label for="a-oname">Name</label><input id="a-oname" autocomplete="off"></div>
        <div class="field"><label for="a-omobile">Mobile</label><input id="a-omobile" type="tel" autocomplete="off"></div>
        <div class="field"><label for="a-oemail">Email</label><input id="a-oemail" type="email" autocomplete="off"></div>
      </fieldset>
      <div class="field full">
        <label for="a-notes">Notes</label>
        <textarea id="a-notes" rows="3"></textarea>
      </div>
      <div class="sheet-foot full">
        <button class="btn-ghost" id="mCancel" type="button">Cancel</button>
        <button class="btn-primary" id="mSave" type="submit">Add property</button>
      </div>
    </form>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* Standalone mode: when this page is not running inside Claude, keep data in this browser's localStorage.
   To share data between managers, replace this block with a connection to a hosted database. */
(function(){
  if(window.claude&&window.claude.use)return;
  var KEY='tenancy-tracker-data',listeners=[];
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
  function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
  function snap(){var o=load();var docs=Object.keys(o).map(function(id){return {id:id,exists:true,data:function(){return o[id]},metadata:{fromCache:false}}});return {docs:docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}}}
  function emit(){listeners.forEach(function(f){f(snap())})}
  function merge(a,b){for(var k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=merge(a[k]&&typeof a[k]==='object'?a[k]:{},b[k])}else a[k]=b[k]}return a}
  window.addEventListener('storage',function(e){if(e.key===KEY)emit()});
  var db={
    collection:function(){return {
      onSnapshot:function(f){listeners.push(f);setTimeout(function(){f(snap())},0);return function(){listeners=listeners.filter(function(x){return x!==f})}},
      add:function(d){var o=load(),id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);o[id]=d;save(o);emit();return Promise.resolve({id:id})}
    }},
    doc:function(path){var id=path.split('/')[1];return {update:function(d){var o=load();if(!o[id])return Promise.reject({code:'invalid_argument'});o[id]=merge(o[id],d);save(o);emit();return Promise.resolve()}}}
  };
  window.claude={use:function(n){return Promise.resolve(n==='db'?db:(n==='user'?{can:function(){return true}}:null))}};
})();
</script>
<script>
(function(){
'use strict';

var MANAGERS=[
  {id:'murray-howe',name:'Murray Howe'},

];
var STEPS=[

  {key:'propertytree',name:'Upload on PropertyTree'}
];
var TOTAL=STEPS.length;

var I={
  chev:'<svg class="ico chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  note:'<svg class="ico" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M5 4h14v12l-4 4H5z"/><path d="M9 9h6M9 13h3"/></svg>'
};

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function initials(n){return n.split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function fmt(t){return new Date(t).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});}
function mgrOf(id){for(var i=0;i<MANAGERS.length;i++)if(MANAGERS[i].id===id)return MANAGERS[i];return null;}
function plural(n,w,ws){return n+' '+(n===1?w:(ws||w+'s'));}

var ui={mgr:MANAGERS[0].id,filter:'all',open:null,step:null,q:''};
var db=null,props=[],loaded=false,readOnly=false,pendingScroll=null,pendingFlash=false;
var drafts=new Map(),timers=new Map(),queues=new Map();

/* ---------- derived state ---------- */
function stepOf(p,key){return (p.steps&&p.steps[key])||{};}
function chainLen(p){var n=0;for(var i=0;i<TOTAL;i++){if(stepOf(p,STEPS[i].key).done)n++;else break;}return n;}
function doneCount(p){var n=0;for(var i=0;i<TOTAL;i++)if(stepOf(p,STEPS[i].key).done)n++;return n;}
function isComplete(p){return doneCount(p)===TOTAL;}
function newest(a,b){return (b.createdAt||0)-(a.createdAt||0);}
function getPath(o,path){var v=o;path.split('.').forEach(function(k){v=(v==null)?undefined:v[k];});return v;}
function nest(path,val){var ks=path.split('.'),out={},cur=out;for(var i=0;i<ks.length-1;i++){cur[ks[i]]={};cur=cur[ks[i]];}cur[ks[ks.length-1]]=val;return out;}
function find(id){for(var i=0;i<props.length;i++)if(props[i].id===id)return props[i];return null;}

/* ---------- writes (one at a time per property) ---------- */
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},2200);}
function writeFail(err){
  var code=err&&err.code;
  toast(code==='invalid_argument'?'You can view this page but not edit it.':'Could not save. Check your connection and try again.');
}
function write(pid,patch){
  if(!db)return Promise.resolve(false);
  var prev=queues.get(pid)||Promise.resolve();
  var next=prev.catch(function(){}).then(function(){return db.doc('properties/'+pid).update(patch);});
  queues.set(pid,next);
  return next.then(function(){return true;},function(e){writeFail(e);return false;});
}

/* ---------- rendering ---------- */
function mine(){return props.filter(function(p){return p.managerId===ui.mgr;}).sort(newest);}

function renderTop(){
  var m=mgrOf(ui.mgr);
  $('#mgrName').textContent=m.name;
  $('#mgrAvatar').textContent=initials(m.name);
}
function renderMgrList(){
  $('#mgrList').innerHTML=MANAGERS.map(function(m){
    var list=props.filter(function(p){return p.managerId===m.id;});
    var done=list.filter(isComplete).length;
    return '<button class="opt" type="button" role="option" id="mo-'+m.id+'" data-mgr="'+m.id+'" aria-selected="'+(m.id===ui.mgr)+'">'+
      '<span class="avatar">'+initials(m.name)+'</span>'+
      '<span class="txt"><b>'+esc(m.name)+'</b><span>'+plural(list.length,'property','properties')+' · '+(list.length-done)+' ongoing</span></span></button>';
  }).join('');
}
function renderHead(){
  var m=mgrOf(ui.mgr),list=mine(),done=list.filter(isComplete).length;
  $('#pageTitle').textContent=m.name;
  $('#pageSub').textContent=plural(list.length,'property','properties')+' · '+(list.length-done)+' ongoing · '+done+' completed · newest first';
  $('#nAll').textContent=list.length;
  $('#nOpen').textContent=list.length-done;
  $('#nDone').textContent=done;
  document.querySelectorAll('[data-filter]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.filter===ui.filter));});
}

function barHTML(n,complete){
  var s='';
  for(var i=0;i<TOTAL;i++)s+='<i class="'+(i<n?'on':(i===n&&!complete?'now':''))+'"></i>';
  return '<div class="bar" role="img" aria-label="'+n+' of '+TOTAL+' steps completed in order">'+s+'</div>';
}
function fieldHTML(p,path,label,type){
  var id='f-'+p.id+'-'+path,v=getPath(p,path)||'';
  return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(v)+'" data-save data-pid="'+p.id+'" data-path="'+path+'" autocomplete="off"'+(readOnly?' disabled':'')+'></div>';
}
function stepHTML(p,s,i,n,complete){
  var st=stepOf(p,s.key),done=!!st.done,ongoing=!complete&&i===n;
  var state=done?'done':(ongoing?'ongoing':'todo');
  var openKey=p.id+':'+s.key,isOpen=ui.step===openKey;
  var meta='';
  if(done)meta='Done'+(st.doneAt?' '+fmt(st.doneAt):'')+(i>=n?' · out of order':'');
  var id='f-'+p.id+'-steps.'+s.key+'.note';
  var body='';
  if(isOpen){
    body='<div class="step-body"><label class="lbl" for="'+id+'">Notes</label>'+
      '<textarea id="'+id+'" data-save data-pid="'+p.id+'" data-path="steps.'+s.key+'.note" rows="3" placeholder="Add a note for this step"'+(readOnly?' disabled':'')+'>'+esc(st.note||'')+'</textarea>'+
      '<div class="actions" role="group" aria-label="Status of '+esc(s.name)+'">'+
        '<button class="pill ok" type="button" id="d-'+p.id+'-'+s.key+'-1" data-act="done" data-pid="'+p.id+'" data-key="'+s.key+'" data-val="1" aria-pressed="'+done+'"'+(readOnly?' disabled':'')+'>Completed</button>'+
        '<button class="pill" type="button" id="d-'+p.id+'-'+s.key+'-0" data-act="done" data-pid="'+p.id+'" data-key="'+s.key+'" data-val="0" aria-pressed="'+(!done)+'"'+(readOnly?' disabled':'')+'>Not completed</button>'+
      '</div></div>';
  }
  return '<li class="step" data-state="'+state+'">'+
    '<button class="step-head" type="button" id="s-'+p.id+'-'+s.key+'" data-act="step" data-pid="'+p.id+'" data-key="'+s.key+'" aria-expanded="'+isOpen+'">'+
      '<span class="dot">'+(done?I.check:(i+1))+'</span>'+
      '<span class="step-main"><span class="step-name">'+esc(s.name)+'</span>'+
        (ongoing?'<span class="tag">Currently ongoing</span>':'')+
        (meta?'<span class="meta">'+meta+'</span>':'')+
      '</span>'+
      (st.note?'<span class="has-note" title="Has a note">'+I.note+'</span>':'')+
      I.chev.replace('class="ico chev"','class="ico chev-s" style="color:var(--ink-3);transform:rotate('+(isOpen?180:0)+'deg)"')+
    '</button>'+body+'</li>';
}
function cardHTML(p){
  var open=ui.open===p.id,n=chainLen(p),complete=isComplete(p);
  var t=getPath(p,'tenant.name'),o=getPath(p,'owner.name'),who=[];
  if(t)who.push('Tenant: '+esc(t));
  if(o)who.push('Owner: '+esc(o));
  var cur=complete?'<b>'+TOTAL+'/'+TOTAL+'</b><span>All steps completed</span>'
    :'<b>'+n+'/'+TOTAL+'</b><span>Currently ongoing: '+esc(STEPS[n].name)+'</span>';
  var h='<article class="card" id="p-'+p.id+'" data-open="'+open+'">'+
    '<button class="card-head" type="button" id="h-'+p.id+'" data-act="toggle" data-pid="'+p.id+'" aria-expanded="'+open+'">'+
      '<span><h3>'+esc(p.address||'Untitled property')+'</h3><p class="who">'+(who.join(' · ')||'No contacts added')+'</p></span>'+
      '<span class="side">'+(complete?'<span class="chip done">Completed</span>':'<span class="chip ongoing">Ongoing</span>')+I.chev+'</span>'+
      barHTML(n,complete)+
      '<span class="cur">'+cur+'<span style="color:var(--ink-3)">Added '+(p.createdAt?fmt(p.createdAt):'')+'</span></span>'+
    '</button>';
  if(open){
    h+='<div class="card-body"><div class="sec-title">Steps</div><ol class="steps">'+
      STEPS.map(function(s,i){return stepHTML(p,s,i,n,complete);}).join('')+'</ol>'+
      '<div class="sec-title">Details</div><div class="details">'+
        '<div class="full">'+fieldHTML(p,'address','Address')+'</div>'+
        '<div class="group"><h4>Tenant</h4>'+fieldHTML(p,'tenant.name','Name')+fieldHTML(p,'tenant.mobile','Mobile','tel')+fieldHTML(p,'tenant.email','Email','email')+'</div>'+
        '<div class="group"><h4>Owner</h4>'+fieldHTML(p,'owner.name','Name')+fieldHTML(p,'owner.mobile','Mobile','tel')+fieldHTML(p,'owner.email','Email','email')+'</div>'+
        '<div class="field full"><label for="f-'+p.id+'-notes">Property notes</label><textarea id="f-'+p.id+'-notes" data-save data-pid="'+p.id+'" data-path="notes" rows="3" placeholder="Anything worth remembering about this property"'+(readOnly?' disabled':'')+'>'+esc(p.notes||'')+'</textarea></div>'+
        '<div class="field full"><label for="m-'+p.id+'">Property manager</label><select id="m-'+p.id+'" data-act="mgr" data-pid="'+p.id+'"'+(readOnly?' disabled':'')+'>'+
          MANAGERS.map(function(m){return '<option value="'+m.id+'"'+(m.id===p.managerId?' selected':'')+'>'+esc(m.name)+'</option>';}).join('')+
        '</select></div>'+
      '</div></div>';
  }
  return h+'</article>';
}

/* Patch the live DOM in place so buttons, focus and typing survive every database update. */
function morphChildren(from,to){
  var keyed={},c,cur=from.firstChild;
  for(c=from.firstChild;c;c=c.nextSibling)if(c.nodeType===1&&c.id)keyed[c.id]=c;
  Array.prototype.slice.call(to.childNodes).forEach(function(n){
    var m=null;
    if(n.nodeType===1&&n.id&&keyed[n.id]){m=keyed[n.id];delete keyed[n.id];}
    else if(cur&&cur.nodeType===n.nodeType&&(n.nodeType!==1||(cur.nodeName===n.nodeName&&!cur.id&&!n.id)))m=cur;
    if(m){
      if(m===cur)cur=cur.nextSibling;else from.insertBefore(m,cur);
      patch(m,n);
    }else from.insertBefore(n,cur);
  });
  while(cur){var nx=cur.nextSibling;from.removeChild(cur);cur=nx;}
  Object.keys(keyed).forEach(function(k){if(keyed[k].parentNode===from)from.removeChild(keyed[k]);});
}
function patch(m,n){
  if(m.nodeType!==1){if(m.nodeValue!==n.nodeValue)m.nodeValue=n.nodeValue;return;}
  var i,a;
  for(i=m.attributes.length-1;i>=0;i--){a=m.attributes[i].name;if(!n.hasAttribute(a))m.removeAttribute(a);}
  for(i=0;i<n.attributes.length;i++){a=n.attributes[i];if(m.getAttribute(a.name)!==a.value)m.setAttribute(a.name,a.value);}
  var t=m.nodeName;
  if(t==='TEXTAREA'||t==='INPUT'){if(m!==document.activeElement&&m.value!==n.value)m.value=n.value;}
  else if(t==='SELECT'){morphChildren(m,n);m.value=n.value;}
  else morphChildren(m,n);
}

function renderList(){
  var el=$('#list');
  if(!db){el.innerHTML='<div class="empty"><b>Shared data is not available here</b>Open this page from your Claude account to use the tracker.</div>';return;}
  if(!loaded){return;}
  var list=mine(),m=mgrOf(ui.mgr);
  var shown=list.filter(function(p){return ui.filter==='all'||(ui.filter==='done'?isComplete(p):!isComplete(p));});
  var html;
  if(!list.length)html='<div class="empty"><b>No properties for '+esc(m.name)+' yet</b>Use Add property to create the first one.</div>';
  else if(!shown.length)html='<div class="empty"><b>'+(ui.filter==='done'?'No completed properties':'No ongoing properties')+'</b>Every property in this list is '+(ui.filter==='done'?'still in progress.':'completed.')+'</div>';
  else html=shown.map(cardHTML).join('');

  var tmp=document.createElement('div');
  tmp.innerHTML=html;
  morphChildren(el,tmp);
  el.querySelectorAll('[data-save]').forEach(function(f){var k=fkey(f);if(drafts.has(k)&&f.value!==drafts.get(k))f.value=drafts.get(k);});
  if(pendingScroll){
    var c=document.getElementById('p-'+pendingScroll);
    if(c){c.scrollIntoView({block:'start',behavior:'smooth'});if(pendingFlash){c.classList.add('flash');}pendingScroll=null;pendingFlash=false;}
  }
}
function render(){renderTop();renderMgrList();renderHead();renderList();if(!$('#results').hidden)runSearch();}

/* ---------- field saving ---------- */
function fkey(el){return el.dataset.pid+'|'+el.dataset.path;}
function onField(el){
  var k=fkey(el);
  drafts.set(k,el.value);
  clearTimeout(timers.get(k));
  timers.set(k,setTimeout(function(){flush(k,el.dataset.pid,el.dataset.path);},700));
}
function flush(k,pid,path){
  clearTimeout(timers.get(k));timers.delete(k);
  if(!drafts.has(k))return;
  var val=drafts.get(k),p=find(pid);
  if(!p||(getPath(p,path)||'')===val){drafts.delete(k);return;}
  write(pid,nest(path,val)).then(function(ok){
    if(ok){if(drafts.get(k)===val)drafts.delete(k);toast('Saved');}
  });
}

/* ---------- navigation ---------- */
function setMgr(id){
  if(!mgrOf(id))return;
  ui.mgr=id;ui.open=null;ui.step=null;
  try{localStorage.setItem('tt-mgr',id);}catch(e){}
  try{location.hash=id;}catch(e){}
}
function gotoProperty(pid){
  var p=find(pid);if(!p)return;
  if(mgrOf(p.managerId))ui.mgr=p.managerId;
  ui.filter='all';ui.open=pid;ui.step=null;
  try{location.hash=ui.mgr;localStorage.setItem('tt-mgr',ui.mgr);}catch(e){}
  pendingScroll=pid;pendingFlash=true;
  $('#q').value='';ui.q='';$('#results').hidden=true;
  render();
}

/* ---------- search ---------- */
function hay(p){
  var m=mgrOf(p.managerId);
  return [p.address,getPath(p,'tenant.name'),getPath(p,'tenant.mobile'),getPath(p,'tenant.email'),getPath(p,'owner.name'),getPath(p,'owner.mobile'),getPath(p,'owner.email'),m&&m.name].join(' ').toLowerCase();
}
function runSearch(){
  var box=$('#results'),q=ui.q.trim().toLowerCase();
  if(!q){box.hidden=true;return;}
  var hits=props.filter(function(p){return hay(p).indexOf(q)>-1;}).sort(newest);
  var more=hits.length>8?hits.length-8:0;
  box.innerHTML=hits.length?hits.slice(0,8).map(function(p){
    var m=mgrOf(p.managerId),n=chainLen(p),c=isComplete(p),t=getPath(p,'tenant.name');
    return '<button class="opt hit" type="button" data-hit="'+p.id+'"><span class="txt"><b>'+esc(p.address||'Untitled property')+'</b><span>'+
      esc((t?t+' · ':'')+(m?m.name:'Unassigned')+' · '+(c?'Completed':'Ongoing, '+n+'/'+TOTAL))+'</span></span></button>';
  }).join('')+(more?'<div class="pop-empty">+ '+more+' more. Keep typing to narrow it down.</div>':'')
    :'<div class="pop-empty">No property matches “'+esc(ui.q.trim())+'”.</div>';
  box.hidden=false;
}

/* ---------- events ---------- */
var list=$('#list');
list.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  var act=b.dataset.act,pid=b.dataset.pid;
  if(act==='toggle'){ui.open=(ui.open===pid)?null:pid;ui.step=null;renderList();}
  else if(act==='step'){var k=pid+':'+b.dataset.key;ui.step=(ui.step===k)?null:k;renderList();}
  else if(act==='done'){
    if(readOnly)return;
    var p=find(pid);if(!p)return;
    var want=b.dataset.val==='1',cur=!!stepOf(p,b.dataset.key).done;
    if(want===cur)return;
    var patch={steps:{}};patch.steps[b.dataset.key]={done:want,doneAt:want?Date.now():null};
    write(pid,patch);
  }
});
list.addEventListener('input',function(e){if(e.target.matches('[data-save]'))onField(e.target);});
list.addEventListener('focusout',function(e){if(e.target.matches&&e.target.matches('[data-save]'))flush(fkey(e.target),e.target.dataset.pid,e.target.dataset.path);});
list.addEventListener('change',function(e){
  var s=e.target;
  if(s.matches('select[data-act="mgr"]')){
    var m=mgrOf(s.value);
    write(s.dataset.pid,{managerId:s.value}).then(function(ok){if(ok&&m)toast('Moved to '+m.name);});
  }
});

document.querySelectorAll('[data-filter]').forEach(function(b){
  b.addEventListener('click',function(){ui.filter=b.dataset.filter;ui.open=null;ui.step=null;renderHead();renderList();});
});

/* manager dropdown */
var mgrBtn=$('#mgrBtn'),mgrList=$('#mgrList');
function mgrToggle(open){
  mgrList.hidden=!open;mgrBtn.setAttribute('aria-expanded',String(open));
  if(open){renderMgrList();var sel=mgrList.querySelector('[aria-selected="true"]');if(sel)sel.focus();}
}
mgrBtn.addEventListener('click',function(){mgrToggle(mgrList.hidden);});
mgrBtn.addEventListener('keydown',function(e){if(e.key==='ArrowDown'){e.preventDefault();mgrToggle(true);}});
mgrList.addEventListener('click',function(e){
  var b=e.target.closest('[data-mgr]');if(!b)return;
  setMgr(b.dataset.mgr);mgrToggle(false);mgrBtn.focus();render();
});
mgrList.addEventListener('keydown',function(e){
  var items=Array.prototype.slice.call(mgrList.querySelectorAll('[data-mgr]')),i=items.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();items[Math.min(i+1,items.length-1)].focus();}
  else if(e.key==='ArrowUp'){e.preventDefault();items[Math.max(i-1,0)].focus();}
  else if(e.key==='Escape'){mgrToggle(false);mgrBtn.focus();}
});

/* search */
var q=$('#q');
q.addEventListener('input',function(){ui.q=q.value;runSearch();});
q.addEventListener('focus',function(){if(ui.q.trim())runSearch();});
q.addEventListener('keydown',function(e){
  if(e.key==='Escape'){$('#results').hidden=true;}
  else if(e.key==='Enter'){var h=$('#results').querySelector('[data-hit]');if(h){e.preventDefault();gotoProperty(h.dataset.hit);}}
  else if(e.key==='ArrowDown'){var f=$('#results').querySelector('[data-hit]');if(f){e.preventDefault();f.focus();}}
});
$('#results').addEventListener('click',function(e){var h=e.target.closest('[data-hit]');if(h)gotoProperty(h.dataset.hit);});
$('#results').addEventListener('keydown',function(e){
  var items=Array.prototype.slice.call($('#results').querySelectorAll('[data-hit]')),i=items.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();items[Math.min(i+1,items.length-1)].focus();}
  else if(e.key==='ArrowUp'){e.preventDefault();if(i<=0)q.focus();else items[i-1].focus();}
  else if(e.key==='Escape'){$('#results').hidden=true;q.focus();}
});
document.addEventListener('click',function(e){
  if(!e.target.closest('#mgr'))mgrToggle(false);
  if(!e.target.closest('#search'))$('#results').hidden=true;
});

window.addEventListener('hashchange',function(){
  var id=location.hash.slice(1);
  if(mgrOf(id)&&id!==ui.mgr){ui.mgr=id;ui.open=null;ui.step=null;render();}
});

/* add property */
var modal=$('#modal'),form=$('#addForm');
function openModal(){
  if(readOnly){toast('You can view this page but not edit it.');return;}
  $('#a-mgr').innerHTML=MANAGERS.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>';}).join('');
  form.reset();$('#a-mgr').value=ui.mgr;$('#a-err').textContent='';
  modal.hidden=false;$('#a-address').focus();
}
function closeModal(){modal.hidden=true;$('#addBtn').focus();}
$('#addBtn').addEventListener('click',openModal);
$('#mClose').addEventListener('click',closeModal);
$('#mCancel').addEventListener('click',closeModal);
modal.addEventListener('mousedown',function(e){if(e.target===modal)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)closeModal();});
form.addEventListener('submit',function(e){
  e.preventDefault();
  var addr=$('#a-address').value.trim();
  if(!addr){$('#a-err').textContent='Enter the property address.';$('#a-address').focus();return;}
  if(!db){toast('Shared data is not available.');return;}
  var btn=$('#mSave');btn.disabled=true;
  var mid=$('#a-mgr').value;
  var doc={
    address:addr,managerId:mid,createdAt:Date.now(),
    tenant:{name:$('#a-tname').value.trim(),mobile:$('#a-tmobile').value.trim(),email:$('#a-temail').value.trim()},
    owner:{name:$('#a-oname').value.trim(),mobile:$('#a-omobile').value.trim(),email:$('#a-oemail').value.trim()},
    notes:$('#a-notes').value.trim(),steps:{}
  };
  db.collection('properties').add(doc).then(function(ref){
    btn.disabled=false;
    modal.hidden=true;
    ui.mgr=mid;ui.filter='all';ui.open=ref.id;ui.step=null;
    try{location.hash=mid;localStorage.setItem('tt-mgr',mid);}catch(e){}
    pendingScroll=ref.id;pendingFlash=true;
    toast('Property added');
    render();
  },function(err){btn.disabled=false;writeFail(err);});
});

/* ---------- boot ---------- */
(function initMgr(){
  var fromHash=location.hash.slice(1),saved=null;
  try{saved=localStorage.getItem('tt-mgr');}catch(e){}
  ui.mgr=mgrOf(fromHash)?fromHash:(mgrOf(saved)?saved:MANAGERS[0].id);
})();
render();

(async function(){
  var banner=$('#banner');
  try{db=await window.claude.use('db');}catch(e){db=null;}
  if(!db){renderList();return;}
  try{
    var user=await window.claude.use('user');
    if(user){var can=await user.can('data.write');if(can===false){readOnly=true;banner.textContent='You can view every property but only editors can make changes.';banner.hidden=false;}}
  }catch(e){}
  var timer=setTimeout(function(){
    if(!loaded){$('#list').innerHTML='<div class="empty"><b>Still connecting</b>The shared data cannot be reached yet. Keep this page open and it will load when the connection returns.</div>';}
  },10000);
  db.collection('properties').onSnapshot(function(snap){
    props=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});
    if(!snap.metadata.fromCache||props.length){loaded=true;clearTimeout(timer);}
    render();
  },function(err){
    clearTimeout(timer);
    $('#list').innerHTML='<div class="empty"><b>Properties could not load</b>'+(err&&err.code==='revoked'?'Your access to this page changed.':'Reload the page to try again.')+'</div>';
  });
})();
})();
</script>
